# Step 5b: forecast assumptions (decisions S5-D3 to S5-D7). Five forecast years after each company's latest fiscal
# year (NVIDIA: FY2027-FY2031). Rates are fractions (0.17 = 17%), days are days, amounts in USD millions.
# NVIDIA's drivers are argued one by one (reason + source); the peers' are mechanical defaults (peer_defaults below),
# used only so the ticker switch works and Step 6 can run a simplified peer DCF. Changing a number here is an analyst
# decision: rebuild with  python python/run_step5.py model  and log anything material in docs/decision_log.md.

forecast_years: 5
scenarios: [Bear, Base, Bull]

sources:
  consensus: "Yahoo Finance consensus via yfinance, snapshot 20261119T171246Z (Step 4, after Q3 results): FY2027 revenue $424.0bn, FY2028 $724.7bn (refresh R-D2; the 20261103T180459Z snapshot gave $411.7bn and $692.2bn)"
  q3fy27_release: "NVIDIA Q3 FY2027 results press release, 17 Nov 2026 (8-K, accession 0001045810-26-000088), unaudited, 10-Q not yet filed: Q3 revenue $115,844m (Data Center $107.6bn, Edge Computing $8.2bn), GAAP gross margin 74.8%; 9M FY2027 revenue $293,681m, gross profit $219,976m, R&D $20,829m, SG&A $4,356m; Q3 dividends $6,026m ($0.25 a share quarterly). Q4 FY2027 outlook: revenue $130.0bn +/-3% (includes an extra week; no China Data Center compute), GAAP gross margin 71-72%, GAAP opex ~$11.0bn, FY2027 tax rate 16-18%"
  q2fy27_release: "NVIDIA Q2 FY2027 results, 26 Aug 2026: Q3 FY2027 outlook revenue $108.0bn +/-2%, GAAP gross margin 74.0% +/-0.5pt, GAAP opex ~$9.2bn; FY2027 tax rate 16-18% (https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000073/q2fy27pr.htm)"
  q2fy27_10q: "NVIDIA 10-Q for Q2 FY2027 (accession 0001045810-26-000075): H1 FY2027 Data Center revenue $164,269m, Edge Computing $13,568m; proceeds from issuance of debt, net $24,896m (H1); $25.0bn senior notes issued June 2026"

