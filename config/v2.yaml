facts:                                      # V2.3: point-in-time annual facts (V2-D12)
  annual_days: [350, 380]                   # a fiscal year (52/53 weeks)
  fy_match_days: 20                         # FY-k is the year ending within 20 days of FY0 end minus k years
  stale_after_days: 456                     # latest FY must end within 15 months of the date, or the company has no current data
  filed_before_date: true                   # a filing counts only if filed strictly before the rebalance date
  line_items:                               # tried in order per fiscal year, first concept with a value wins; latest-filed value as of the date
    revenue: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, RevenueFromContractWithCustomerIncludingAssessedTax, SalesRevenueNet, SalesRevenueGoodsNet]
    cost_of_revenue: [CostOfRevenue, CostOfGoodsAndServicesSold, CostOfGoodsSold]
    gross_profit: [GrossProfit]             # if missing: revenue - cost_of_revenue, labelled derived
    operating_income: [OperatingIncomeLoss]       # if missing: pretax income + interest expense (EBIT), labelled derived
    interest_expense: [InterestExpense, InterestExpenseNonoperating, InterestExpenseDebt, InterestAndDebtExpense]
    net_income: [NetIncomeLoss, NetIncomeLossAvailableToCommonStockholdersBasic, ProfitLoss]
    eps_diluted: [EarningsPerShareDiluted, EarningsPerShareBasicAndDiluted]
    shares_diluted: [WeightedAverageNumberOfDilutedSharesOutstanding, WeightedAverageNumberOfShareOutstandingBasicAndDiluted, WeightedAverageNumberOfSharesOutstandingBasic]
    pretax_income: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]
    income_tax: [IncomeTaxExpenseBenefit]
    operating_cash_flow: [NetCashProvidedByUsedInOperatingActivities, NetCashProvidedByUsedInOperatingActivitiesContinuingOperations]
    capex: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets, PaymentsToAcquireOtherPropertyPlantAndEquipment]
    d_and_a: [DepreciationDepletionAndAmortization, DepreciationAndAmortization, DepreciationAmortizationAndAccretionNet, UtilitiesOperatingExpenseDepreciationAndAmortization]
    depreciation: [Depreciation]                  # if no D&A total: depreciation + amortization of intangibles, labelled derived
    amortization: [AmortizationOfIntangibleAssets, AdjustmentForAmortization]
    current_assets: [AssetsCurrent]
    current_liabilities: [LiabilitiesCurrent]
    inventory: [InventoryNet]               # missing: 0, flagged
    equity: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
    cash: [CashAndCashEquivalentsAtCarryingValue, CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents]
    st_investments: [ShortTermInvestments, DebtSecuritiesCurrent, MarketableSecuritiesCurrent, AvailableForSaleSecuritiesDebtSecuritiesCurrent]   # missing: 0, flagged
    debt_current: [DebtCurrent, LongTermDebtCurrent, LongTermDebtAndCapitalLeaseObligationsCurrent, ShortTermBorrowings]   # missing: 0, flagged
    debt_noncurrent: [LongTermDebtNoncurrent, LongTermDebtAndCapitalLeaseObligations, LongTermNotesPayable]   # missing: a total-debt concept if tagged, else 0, flagged
    debt_total_fallback: [LongTermDebt, DebtAndCapitalLeaseObligations, DebtLongtermAndShorttermCombinedAmount]
  instant_items: [current_assets, current_liabilities, inventory, equity, cash, st_investments, debt_current, debt_noncurrent, debt_total_fallback]
  zero_if_missing: [inventory, st_investments, debt_current]
  statutory_tax_rate: 0.21                  # V1 rule: used when the effective rate is unavailable or outside 0-100%
prices:                                     # V2.4: daily prices (yfinance; Yahoo Finance)
  start: "2015-01-01"
  extra_symbols: [SPY]
  raw_dir_name: prices                      # under the bulk data folder
  seconds_between_requests: 0.4
scores:                                     # V2.5 (V2-D13, V2-D14)
  min_tests_scored: 7                       # of 9; fewer and the company is not ranked at that date
  impute_missing: sector_median_points      # V2-D13 (revised 2026-11-18, before any backtest was run): a test that cannot be scored
                                            # takes the median points of its sector's scored companies on that test at that date,
                                            # so a data gap neither helps (insurers, negative equity) nor hurts; rank on total points of 18
  one_line_per_company: true                # dual share classes (GOOG/GOOGL, FOX/FOXA, NWS/NWSA): keep one ticker per CIK
  tests:                                    # Step 4 thresholds; PEG dropped; ROIC vs a fixed hurdle (V2-D3)
    1: {name: "Revenue growth, 5-yr CAGR",    metric: revenue_cagr_5y,     direction: higher, pass: 0.10, near: 0.05}
    2: {name: "P/E (trailing, latest FY)",    metric: pe_fy,               direction: lower,  pass: 25,   near: 35,  fail_when_null: "latest FY diluted EPS <= 0"}
    4: {name: "ROE, 5-yr average",            metric: roe_5y_avg,          direction: higher, pass: 0.15, near: 0.10}
    5: {name: "Quick ratio",                  metric: quick_ratio,         direction: higher, pass: 1.5,  near: 1.0}
    6: {name: "Gross margin vs sector median", metric: gross_margin_vs_sector, direction: higher, pass: 0, near: -0.05}
    7: {name: "FCF conversion (FCF / NI)",    metric: fcf_conversion,      direction: higher, pass: 0.90, near: 0.70, fail_when_null: "net income <= 0"}
    8: {name: "Net debt / EBITDA",            metric: net_debt_to_ebitda,  direction: lower,  pass: 1,    near: 2,   fail_when_null: "EBITDA <= 0"}
    9: {name: "ROIC (fixed hurdle)",          metric: roic,                direction: higher, pass: 0.15, near: 0.10}
    10: {name: "Share count, 5-yr change",    metric: shares_change_5y,    direction: lower,  pass: -0.02, near: 0.02}
  v1_reconcile:                             # V2 engine vs Version 1 (Step 3 exports) for the six companies, same fiscal year
    metrics: [revenue_cagr_5y, gross_margin, roe_5y_avg, quick_ratio, fcf_conversion, net_debt_to_ebitda, roic, shares_change_5y]
    abs_tol: 0.005
    min_share_agreeing: 0.85
backtest_v2:                                # V2.6 (V2-D15, V2-D16)
  universe_benchmark: true                  # equal-weight all ranked companies: same data, same survivorship limits as the portfolio
  rf: 0.0                                   # Sharpe on excess over 0, labelled
  trading_days: 252
