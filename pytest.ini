[pytest]
testpaths = tests
pythonpath = python
# Default run is offline only. Live SEC and reconciliation tests run only when asked for with -m.
addopts = -m "not live and not reconciliation" -ra
markers =
    live: reaches data.sec.gov (needs SEC_USER_AGENT); run with  pytest -m live
    reconciliation: compares real output with reference_values.csv; run with  pytest -m reconciliation
